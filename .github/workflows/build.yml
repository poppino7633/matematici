name: Compilează PDF-uri

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-24.04
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - uses: actions/checkout@v4
      - id: sources
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z", "*.tex"]).decode().split("\0")
          sources = [name for name in files if name and "\\documentclass" in pathlib.Path(name).read_text()]
          if not sources:
              raise SystemExit("Nu s-au găsit documente LaTeX.")
          names = [pathlib.Path(name).stem for name in sources]
          if len(names) != len(set(names)):
              raise SystemExit("Documentele trebuie să aibă nume PDF distincte.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("sources=" + json.dumps(sources) + "\n")
  build:
    needs: documents
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.documents.outputs.sources) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalează LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Compilează lecțiile
        env:
          LATEX_SOURCE: ${{ matrix.source }}
        run: bash scripts/build-pdfs.sh . .build "$LATEX_SOURCE"
      - uses: actions/upload-artifact@v7
        with:
          path: .build/**/*.pdf
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*.pdf'
          merge-multiple: true
          path: pdf
      - name: Publică PDF-urile în Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' pdfs < <(find pdf -type f -name '*.pdf' -print0)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${pdfs[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${pdfs[@]}" --verify-tag --generate-notes
          fi
